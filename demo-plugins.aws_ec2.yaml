plugin: amazon.aws.aws_ec2
regions:
- us-east-1
filters:
  tag:Name: frontend
  instance-state-name : running   # so ila 2 kakunda enni ayina add chesukovachu 
hostnames:  # what u want, those will get it form here 
  - private-ip-address
compose:
  # This sets the `ansible_host` variable to connect with the private IP address without changing the hostname.
  ansible_host: private_ip_address
keyed_groups:  # it is used to set grp name
  - key: tags.Name
    prefix: "dynamic" # dynamic_frontend ....... any name u can forname 
    separator: "_"